<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>セルフケアナビ｜マニュアル</title>
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:0;font-family:"Zen Maru Gothic",sans-serif;color:#463a3d;background:linear-gradient(180deg,#fffaf8 0%,#fff7f6 44%,#fffaf8 100%);min-height:100vh;display:grid;place-items:center;padding:40px 20px}
.container{max-width:560px;text-align:center}
.eyebrow{display:inline-block;padding:6px 16px;border:1px solid #c98791;border-radius:999px;color:#a96874;font-size:12px;font-weight:700;letter-spacing:0.15em;margin-bottom:16px}
h1{font-family:"Kaisei Decol",serif;font-size:clamp(1.8rem,6vw,2.6rem);color:#8f5662;margin:0 0 12px;font-weight:600}
.lead{color:#77676b;font-size:15px;margin:0 0 40px}
.card{background:rgba(255,253,252,0.94);border:1px solid rgba(220,196,200,0.72);border-radius:20px;padding:28px 24px;margin:14px 0;box-shadow:0 12px 28px rgba(130,91,99,0.08);text-decoration:none;color:inherit;display:block;transition:transform 0.2s, box-shadow 0.2s}
.card:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(130,91,99,0.14)}
.card-icon{font-size:2.2rem;margin-bottom:12px}
.card-title{font-family:"Kaisei Decol",serif;font-size:1.35rem;color:#8f5662;margin:0 0 6px}
.card-desc{color:#77676b;font-size:14px;margin:0}
footer{margin-top:40px;color:#a49297;font-size:12px}
</style>
</head>
<body>
<div class="container">
<span class="eyebrow">MANUAL</span>
<h1>セルフケアナビ<br>マニュアル</h1>
<p class="lead">目的に応じてお選びください</p>

<a href="user.html" class="card">
<div class="card-icon">📱</div>
<div class="card-title">ユーザー向けガイド</div>
<p class="card-desc">3日間チャレンジ参加者向け・使い方の流れ</p>
</a>

<a href="tomoko.html" class="card">
<div class="card-icon">🌿</div>
<div class="card-title">運用マニュアル（ともこさん用）</div>
<p class="card-desc">管理者向け・スプシ / GAS / リマインドの仕組み</p>
</a>

<footer>© 2026 セルフケアナビ</footer>
</div>
</body>
</html>
