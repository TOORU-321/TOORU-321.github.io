<body class="voice-body">
  <a class="skip-link" href="#voice-main">本文へ移動</a>

  <!-- 招待コードがないときの案内 -->
  <div id="voice-gate" class="vgate" hidden>
    <div class="vgate__inner">
      <h1 class="vgate__title" data-voice="gateTitle"></h1>
      <p class="vgate__text" data-voice="gateBody"></p>
    </div>
  </div>

  <main id="voice-main" class="vwrap" hidden>
    <header class="vhead">
      <p class="vhead__eyebrow" data-voice="eyebrow"></p>
      <h1 class="vhead__title" data-voice="heading"></h1>
      <p class="vhead__lead" data-voice="lead"></p>
    </header>

    <div data-voice="formSlot"></div>
  </main>

  <!-- 送信後 -->
  <div id="voice-done" class="vdone" hidden>
    <div class="vdone__inner">
      <h1 class="vdone__title" data-voice="doneHeading"></h1>
      <p class="vdone__text" data-voice="doneBody"></p>
      <a class="btn btn--secondary vdone__back" data-voice="backToApp" href="index.html"></a>
    </div>
  </div>
