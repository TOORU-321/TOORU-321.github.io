<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>診断結果ダッシュボード | ともこ先生専用</title>
<style>
  :root {
    --pink-1: #fef7f8;
    --pink-2: #fbf0f2;
    --pink-3: #f3d5da;
    --brand: #a96874;
    --brand-dark: #8b4d5a;
    --text: #4d3a3d;
    --gray: #8b7a7d;
    --border: rgba(169,104,116,0.15);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Meiryo", sans-serif;
    background: linear-gradient(180deg, var(--pink-1), #fff);
    color: var(--text);
    min-height: 100vh;
  }
  .container { max-width: 1200px; margin: 0 auto; padding: 22px 18px 60px; }

  header.main {
    background: #fff; border-radius: 20px; padding: 20px 22px;
    box-shadow: 0 8px 30px rgba(169,104,116,0.08);
    border: 1px solid var(--border);
    margin-bottom: 20px;
  }
  header.main h1 {
    font-size: 20px; color: var(--brand-dark); margin: 0 0 6px;
    display: flex; align-items: center; gap: 10px;
  }
  header.main h1 .icon { font-size: 24px; }
  header.main { position: relative; }
  .btn-logout {
    position: absolute; top: 18px; right: 20px;
    background: #fff; color: var(--gray);
    border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 999px;
    font-size: 12px; font-weight: 700; cursor: pointer;
    font-family: inherit; transition: all 0.15s;
  }
  .btn-logout:hover { background: #fdecee; color: #d64545; border-color: #d64545; }
  header.main .sub { color: var(--gray); font-size: 13px; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: #fff; border-radius: 14px; padding: 14px 16px; box-shadow: 0 4px 16px rgba(169,104,116,0.06); border: 1px solid var(--border); }
  .stat-card .label { color: var(--gray); font-size: 12px; margin-bottom: 4px; }
  .stat-card .value { color: var(--brand-dark); font-size: 22px; font-weight: 800; }

  .toolbar { background: #fff; border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; box-shadow: 0 4px 16px rgba(169,104,116,0.06); border: 1px solid var(--border); margin-bottom: 14px; }
  .toolbar input, .toolbar select { border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 14px; font-family: inherit; color: var(--text); background: #fff; }
  .toolbar input[type="search"] { min-width: 220px; flex: 1; }
  .toolbar button { border: none; background: var(--brand); color: #fff; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .toolbar button:hover { background: var(--brand-dark); }
  .toolbar .count { color: var(--gray); font-size: 13px; margin-left: auto; }

  .table-wrap { background: #fff; border-radius: 14px; overflow-x: auto; -webkit-overflow-scrolling: touch; box-shadow: 0 4px 16px rgba(169,104,116,0.06); border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 820px; }
  thead th { background: var(--pink-2); color: var(--brand-dark); text-align: left; padding: 12px 14px; font-weight: 700; border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
  thead th:hover { background: var(--pink-3); }
  thead th .sort { color: var(--gray); font-size: 11px; margin-left: 4px; }
  tbody td { padding: 12px 14px; border-bottom: 1px solid var(--border); color: var(--text); }
  tbody tr:hover { background: var(--pink-1); }
  tbody tr:last-child td { border-bottom: none; }

  .type-chip { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #fff; white-space: nowrap; }
  .type-chip.t-ぐったり { background: #d4a574; }
  .type-chip.t-もやもや { background: #8fa8b5; }
  .type-chip.t-ぽちゃぽちゃ { background: #b19cd9; }
  .type-chip.t-ふらふら { background: #a5c9a5; }
  .type-chip.t-どよ〜ん { background: #7f7f9c; }
  .type-chip.t-からから { background: #e29a8b; }

  .status-pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .status-pill.pending { background: #fff5e1; color: #b3830a; }
  .status-pill.done { background: #e6f5ec; color: #2b8a4a; }

  .btn-open { display: inline-block; background: var(--brand); color: #fff !important; text-decoration: none; padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; white-space: nowrap; margin-right: 4px; cursor: pointer; border: none; font-family: inherit; }
  .btn-open:hover { background: var(--brand-dark); }
  .btn-done { display: inline-block; background: #fff; color: var(--brand) !important; text-decoration: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; white-space: nowrap; cursor: pointer; border: 1px solid var(--brand); font-family: inherit; }
  .btn-done:hover { background: var(--pink-2); }
  .btn-done.completed { background: #e6f5ec; color: #2b8a4a !important; border-color: #2b8a4a; }
  .btn-chat { display: inline-block; background: #06C755; color: #fff !important; text-decoration: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; white-space: nowrap; margin-left: 4px; cursor: pointer; border: none; font-family: inherit; }
  .btn-chat:hover { background: #05a748; }
  .btn-sheet { display: inline-flex; align-items: center; gap: 6px; background: #0f9d58; color: #fff !important; text-decoration: none; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; border: none; font-family: inherit; cursor: pointer; }
  .btn-sheet:hover { background: #0c7f47; }

  .notif-toggle { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: #fff; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text); font-family: inherit; }
  .notif-toggle:hover { border-color: var(--brand); }
  .notif-toggle.on { background: var(--pink-2); border-color: var(--brand); color: var(--brand-dark); font-weight: 700; }
  .notif-toggle .dot { width: 10px; height: 10px; border-radius: 50%; background: #ccc; }
  .notif-toggle.on .dot { background: var(--brand); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--gray); }
  .empty-state .big { font-size: 48px; margin-bottom: 12px; }

  .auth-screen { display: none; max-width: 380px; margin: 80px auto; background: #fff; padding: 30px 26px; border-radius: 18px; box-shadow: 0 8px 30px rgba(169,104,116,0.15); border: 1px solid var(--border); text-align: center; }
  .auth-screen h2 { color: var(--brand-dark); margin: 0 0 14px; }
  .auth-screen input { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 15px; font-family: inherit; margin-bottom: 14px; }
  .auth-screen button { width: 100%; padding: 12px; background: var(--brand); color: #fff; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 15px; }
  .auth-screen .err { color: #d64545; font-size: 13px; margin-top: 10px; height: 18px; }

  @media (max-width: 720px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    thead th, tbody td { padding: 8px 10px; font-size: 12.5px; }
  }
</style>
</head>
<body>

<div class="auth-screen" id="authScreen">
  <h2>🔒 管理画面</h2>
  <p style="color:var(--gray); font-size:13px; margin-bottom:18px;">合言葉を入力してください</p>
  <input type="password" id="authInput" placeholder="合言葉">
  <button onclick="tryAuth()">開く</button>
  <div class="err" id="authErr"></div>
</div>

<div class="container" id="mainScreen" style="display:none;">
  <header class="main">
    <h1><span class="icon">📊</span> 診断結果ダッシュボード</h1>
    <div class="sub">ダイエット迷子診断を送信したユーザー一覧 / ともこ先生専用</div>
    <button class="btn-logout" onclick="logout()">🚪 ログアウト</button>
  </header>

  <div class="stats">
    <div class="stat-card"><div class="label">累計送信数</div><div class="value" id="statTotal">0</div></div>
    <div class="stat-card"><div class="label">未対応</div><div class="value" id="statPending">0</div></div>
    <div class="stat-card"><div class="label">今週</div><div class="value" id="statWeek">0</div></div>
    <div class="stat-card"><div class="label">今日</div><div class="value" id="statToday">0</div></div>
  </div>

  <div class="toolbar">
    <input type="search" id="searchBox" placeholder="🔍 お名前で検索...">
    <select id="typeFilter">
      <option value="">すべてのタイプ</option>
      <option value="ぐったり迷子">ぐったり迷子</option>
      <option value="もやもや迷子">もやもや迷子</option>
      <option value="ぽちゃぽちゃ迷子">ぽちゃぽちゃ迷子</option>
      <option value="ふらふら迷子">ふらふら迷子</option>
      <option value="どよ〜ん迷子">どよ〜ん迷子</option>
      <option value="からから迷子">からから迷子</option>
    </select>
    <select id="statusFilter">
      <option value="">対応状況：すべて</option>
      <option value="未対応">未対応のみ</option>
      <option value="対応済">対応済のみ</option>
    </select>
    <button onclick="loadData()">🔄 更新</button>
    <a class="btn-sheet" target="_blank" href="https://docs.google.com/spreadsheets/d/1kS3t_J3rEaOnmS5sXicVqWO9nz-a0oMsG-kXVnSc11o/edit">📊 スプシで開く</a>
    <button class="notif-toggle" id="notifToggle" onclick="toggleNotifications()">
      <span class="dot"></span>
      <span id="notifLabel">🔔 通知オフ</span>
    </button>
    <span class="count" id="countLabel">-</span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-sort="date">送信日時<span class="sort">▼</span></th>
          <th data-sort="name">お名前</th>
          <th data-sort="type">診断タイプ</th>
          <th data-sort="uid">LINE UID</th>
          <th data-sort="status">対応状況</th>
          <th>アクション</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="6" class="empty-state"><div class="big">⏳</div>読み込み中...</td></tr>
      </tbody>
    </table>
  </div>

  <p style="color:var(--gray); font-size:11px; text-align:center; margin-top:20px;">
    このページはともこ先生専用です。URLを他人に共有しないでください。<br>
    ダイエット迷子診断 管理画面 © 2026
  </p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-messaging-compat.js"></script>

<script>
  var DIAGNOSIS_GAS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzDeZXbOEV7_k5OzYN1wr43Sy9q3jFx4MybFjjterJoq1RDFOOr0n-xGxaMP5EEDBA3kA/exec';
  var ADMIN_TOKEN = 'tomoko-admin-2026';
  var RESULT_VIEW_URL = 'https://columns.l-mine.com/result_view.html';

  var AUTH_KEY = 'tomoko_admin_auth';
  var AUTH_EXP_KEY = 'tomoko_admin_auth_exp';
  var AUTH_TTL_MS = 30 * 24 * 60 * 60 * 1000; // 30日間

  function checkAuth(){
    var stored = localStorage.getItem(AUTH_KEY);
    var exp = Number(localStorage.getItem(AUTH_EXP_KEY) || 0);
    if (stored === ADMIN_TOKEN && Date.now() < exp) {
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('mainScreen').style.display = 'block';
      loadData();
    } else {
      localStorage.removeItem(AUTH_KEY);
      localStorage.removeItem(AUTH_EXP_KEY);
      document.getElementById('authScreen').style.display = 'block';
      document.getElementById('mainScreen').style.display = 'none';
    }
  }
  function tryAuth(){
    var v = document.getElementById('authInput').value.trim();
    if (v === ADMIN_TOKEN) {
      localStorage.setItem(AUTH_KEY, ADMIN_TOKEN);
      localStorage.setItem(AUTH_EXP_KEY, String(Date.now() + AUTH_TTL_MS));
      checkAuth();
    } else {
      document.getElementById('authErr').textContent = '合言葉が違います';
    }
  }
  window.logout = function(){
    if (!confirm('ログアウトしますか？（次回は合言葉の再入力が必要です）')) return;
    localStorage.removeItem(AUTH_KEY);
    localStorage.removeItem(AUTH_EXP_KEY);
    document.getElementById('authInput').value = '';
    document.getElementById('authErr').textContent = '';
    checkAuth();
  };
  document.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && document.activeElement.id === 'authInput') tryAuth();
  });

  var allRecords = [];
  var sortKey = 'date';
  var sortDir = 'desc';

  async function loadData(){
    var body = document.getElementById('tableBody');
    body.innerHTML = '<tr><td colspan="6" class="empty-state"><div class="big">⏳</div>読み込み中...</td></tr>';
    try {
      var res = await fetch(DIAGNOSIS_GAS_ENDPOINT + '?admin=' + encodeURIComponent(ADMIN_TOKEN));
      var data = await res.json();
      if (!data.ok) throw new Error(data.error || 'load failed');
      allRecords = data.records || [];
      updateStats();
      renderTable();
    } catch (err) {
      console.error(err);
      body.innerHTML = '<tr><td colspan="6" class="empty-state"><div class="big">😢</div>データ取得エラー: ' + escapeHtml(String(err)) + '</td></tr>';
    }
  }

  function updateStats(){
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    var weekAgo = today - 7*24*60*60*1000;
    var total = allRecords.length;
    var pending = 0, weekCnt = 0, todayCnt = 0;
    allRecords.forEach(function(r){
      if (r['ステータス'] !== '対応済') pending++;
      var d = new Date(r['送信日時']).getTime();
      if (d >= today) todayCnt++;
      if (d >= weekAgo) weekCnt++;
    });
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statPending').textContent = pending;
    document.getElementById('statWeek').textContent = weekCnt;
    document.getElementById('statToday').textContent = todayCnt;
  }

  function renderTable(){
    var searchQ = document.getElementById('searchBox').value.trim().toLowerCase();
    var typeQ = document.getElementById('typeFilter').value;
    var statusQ = document.getElementById('statusFilter').value;
    var filtered = allRecords.filter(function(r){
      if (searchQ && String(r['お名前']||'').toLowerCase().indexOf(searchQ) < 0) return false;
      if (typeQ && r['診断タイプ'] !== typeQ) return false;
      if (statusQ && r['ステータス'] !== statusQ) return false;
      return true;
    });
    filtered.sort(function(a, b){
      var av, bv;
      switch(sortKey){
        case 'name': av = a['お名前']||''; bv = b['お名前']||''; break;
        case 'type': av = a['診断タイプ']||''; bv = b['診断タイプ']||''; break;
        case 'uid': av = a['LINE UID']||''; bv = b['LINE UID']||''; break;
        case 'status': av = a['ステータス']||''; bv = b['ステータス']||''; break;
        default: av = new Date(a['送信日時']).getTime(); bv = new Date(b['送信日時']).getTime();
      }
      if (av < bv) return sortDir === 'asc' ? -1 : 1;
      if (av > bv) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });
    document.getElementById('countLabel').textContent = filtered.length + ' 件';
    var body = document.getElementById('tableBody');
    if (filtered.length === 0) {
      body.innerHTML = '<tr><td colspan="6" class="empty-state"><div class="big">📭</div>該当データがありません</td></tr>';
      return;
    }
    body.innerHTML = filtered.map(function(r){
      var typeName = (r['診断タイプ']||'').replace('迷子','');
      var status = r['ステータス'] || '未対応';
      var isPending = status !== '対応済';
      var uid = r['LINE UID'] || '-';
      var shortUid = uid.length > 12 ? uid.substr(0,10)+'…' : uid;
      return '<tr>' +
        '<td>' + escapeHtml(r['送信日時']||'-') + '</td>' +
        '<td><strong>' + escapeHtml(r['お名前']||'(未登録)') + '</strong></td>' +
        '<td><span class="type-chip t-' + escapeHtml(typeName) + '">' + escapeHtml(r['診断タイプ']||'-') + '</span></td>' +
        '<td style="font-family:monospace; font-size:11px; color:var(--gray);" title="' + escapeHtml(uid) + '">' + escapeHtml(shortUid) + '</td>' +
        '<td><span class="status-pill ' + (isPending?'pending':'done') + '">' + escapeHtml(status) + '</span></td>' +
        '<td>' +
          '<a class="btn-open" target="_blank" href="' + RESULT_VIEW_URL + '?id=' + encodeURIComponent(r['ID']||'') + '">結果を開く</a>' +
          (uid && uid !== '-' ? '<a class="btn-chat" target="_blank" href="https://autosns.jp/chat#/room/' + encodeURIComponent(uid) + '">💬 チャット</a>' : '') +
          '<button class="btn-done' + (isPending?'':' completed') + '" style="margin-left:4px;" onclick="toggleStatus(\'' + escapeHtml(r['ID']||'') + '\', \'' + (isPending?'対応済':'未対応') + '\')">' +
          (isPending ? '✓ 対応済にする' : '↩ 未対応に戻す') +
          '</button>' +
        '</td>' +
      '</tr>';
    }).join('');
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  document.getElementById('searchBox').addEventListener('input', renderTable);
  document.getElementById('typeFilter').addEventListener('change', renderTable);
  document.getElementById('statusFilter').addEventListener('change', renderTable);
  document.querySelectorAll('thead th[data-sort]').forEach(function(th){
    th.addEventListener('click', function(){
      var key = th.dataset.sort;
      if (sortKey === key) sortDir = (sortDir === 'asc' ? 'desc' : 'asc');
      else { sortKey = key; sortDir = 'desc'; }
      document.querySelectorAll('thead th .sort').forEach(function(s){ s.textContent=''; });
      th.querySelector('.sort').textContent = sortDir === 'asc' ? '▲' : '▼';
      renderTable();
    });
  });

  var FIREBASE_CONFIG = {
    apiKey: 'AIzaSyBkjmETaws9Wlnv_UtrDlNrXMGuw96ka2E',
    authDomain: 'tomoko-diagnosis.firebaseapp.com',
    projectId: 'tomoko-diagnosis',
    storageBucket: 'tomoko-diagnosis.firebasestorage.app',
    messagingSenderId: '53605068113',
    appId: '1:53605068113:web:22dc9cd329cfc76f0eb770'
  };
  var VAPID_KEY = 'BNOq1Z7A5X3xPsCN2obzdOwspfB8U5gwNZ6bl8HMiwMGZeJ3MGCo67SCZnd0GjrHRCYtJlHgsIlb2qB5Zpg1aP8';

  var fcmMessaging = null;
  var fcmCurrentToken = null;

  async function initFirebaseIfReady(){
    if (FIREBASE_CONFIG.apiKey.indexOf('PASTE_') === 0) return false;
    if (fcmMessaging) return true;
    try {
      if (!window.firebase) return false;
      firebase.initializeApp(FIREBASE_CONFIG);
      fcmMessaging = firebase.messaging();
      fcmMessaging.onMessage(function(payload){
        console.log('[FCM前景通知]', payload);
        try {
          new Notification(payload.notification.title, {
            body: payload.notification.body,
            icon: '/favicon.png'
          });
        } catch(e) {}
        loadData();
      });
      return true;
    } catch(e) { console.error('Firebase init失敗:', e); return false; }
  }

  function updateNotifButton(state){
    var btn = document.getElementById('notifToggle');
    var lbl = document.getElementById('notifLabel');
    btn.disabled = false;
    if (state === 'on') { btn.classList.add('on'); lbl.textContent = '🔔 通知オン'; }
    else if (state === 'unsupported') { btn.classList.remove('on'); lbl.textContent = '🔕 通知未対応 (?)'; }
    else if (state === 'not-configured') { btn.classList.remove('on'); lbl.textContent = '⚙️ 通知未設定'; }
    else { btn.classList.remove('on'); lbl.textContent = '🔔 通知オフ'; }
  }

  function isIOS(){
    return /iPhone|iPad|iPod/.test(navigator.userAgent) ||
           (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }
  function isStandalone(){
    return window.matchMedia('(display-mode: standalone)').matches ||
           window.navigator.standalone === true;
  }
  function showIosGuide(){
    alert('📱 iPhoneでの通知セットアップ手順\n\n' +
      '1️⃣ Safariでこのページを開く（Chromeアプリ✗）\n' +
      '2️⃣ 下部の共有ボタン(□↑)をタップ\n' +
      '3️⃣ 「ホーム画面に追加」を選択\n' +
      '4️⃣ Safariを一度閉じる\n' +
      '5️⃣ ホーム画面のアイコンから開く ← ここ重要\n' +
      '6️⃣ 再度この通知ボタンをタップ\n\n' +
      '※ iOS 16.4 以降が必要です');
  }

  window.toggleNotifications = async function(){
    if (!('Notification' in window)) {
      if (isIOS() && !isStandalone()) {
        showIosGuide();
      } else if (isIOS()) {
        alert('iOSのバージョンが古いか、通知が使えない状態です。iOS 16.4以降にアップデートしてお試しください。');
      } else {
        alert('お使いのブラウザは通知に対応していません。Chrome / Edge / Safari 最新版でお試しください。');
      }
      updateNotifButton('unsupported');
      return;
    }
    var ready = await initFirebaseIfReady();
    if (!ready) { alert('Firebase未設定です'); return; }
    var currentlyOn = document.getElementById('notifToggle').classList.contains('on');
    if (currentlyOn) {
      if (fcmCurrentToken) {
        try {
          await fetch(DIAGNOSIS_GAS_ENDPOINT, {
            method: 'POST',
            body: JSON.stringify({ action: 'removeFcmToken', token: fcmCurrentToken, admin: ADMIN_TOKEN }),
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }
          });
        } catch(e) {}
      }
      localStorage.removeItem('tomoko_fcm_on');
      updateNotifButton('off');
    } else {
      try {
        var perm = await Notification.requestPermission();
        if (perm !== 'granted') { alert('通知を許可してください'); return; }
        var reg = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
        var token = await fcmMessaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
        if (!token) { alert('トークン取得失敗'); return; }
        fcmCurrentToken = token;
        await fetch(DIAGNOSIS_GAS_ENDPOINT, {
          method: 'POST',
          body: JSON.stringify({ action: 'saveFcmToken', token: token, admin: ADMIN_TOKEN }),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });
        localStorage.setItem('tomoko_fcm_on', '1');
        updateNotifButton('on');
        alert('✅ 通知をオンにしました！新しい診断結果が届くとブラウザに通知されます');
      } catch(e){
        console.error(e);
        alert('通知オンに失敗しました: ' + e.message);
      }
    }
  };

  async function initNotifState(){
    if (FIREBASE_CONFIG.apiKey.indexOf('PASTE_') === 0) { updateNotifButton('not-configured'); return; }
    if (!('Notification' in window)) { updateNotifButton('unsupported'); return; }
    var savedOn = localStorage.getItem('tomoko_fcm_on') === '1';
    if (savedOn && Notification.permission === 'granted') {
      await initFirebaseIfReady();
      try {
        var reg = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
        fcmCurrentToken = await fcmMessaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
        updateNotifButton('on');
      } catch(e) { updateNotifButton('off'); }
    } else {
      updateNotifButton('off');
    }
  }
  setTimeout(initNotifState, 500);

  window.toggleStatus = async function(id, newStatus){
    if (!id) return;
    try {
      var res = await fetch(DIAGNOSIS_GAS_ENDPOINT, {
        method: 'POST',
        body: JSON.stringify({ action: 'updateStatus', id: id, status: newStatus, admin: ADMIN_TOKEN }),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
      });
      var data = await res.json();
      if (!data.ok) throw new Error(data.error || 'update failed');
      var rec = allRecords.find(function(r){ return String(r['ID']) === String(id); });
      if (rec) rec['ステータス'] = newStatus;
      updateStats();
      renderTable();
    } catch(err){
      console.error(err);
      alert('ステータス変更に失敗しました: ' + err);
    }
  };

  checkAuth();
</script>
</body>
</html>
